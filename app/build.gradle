plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace 'com.fshu'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file(localProps['KEYSTORE_PATH'])
            storePassword localProps['KEYSTORE_PASSWORD']
            keyAlias localProps['KEY_ALIAS']
            keyPassword localProps['KEY_PASSWORD']
        }
    }

    defaultConfig {
        applicationId "com.fshu"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // OkHttp (WebSocket)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // WebRTC
    implementation 'io.getstream:stream-webrtc-android:1.1.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image loading (thumbnails in chat)
    implementation 'io.coil-kt:coil:2.5.0'

    // WorkManager (service watchdog)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Encrypted SharedPreferences (Android Keystore-backed password storage)
    implementation 'androidx.security:security-crypto:1.0.0'

    // Location (FusedLocationProviderClient)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-messaging'
}
